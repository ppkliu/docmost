name: docmost-dev

# Use with:
#   docker compose --env-file .env.dev -f docker-compose.dev.yml up
# because compose port interpolation reads --env-file, not service env_file.
services:
  docmost-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    depends_on:
      - db
      - valkey
    env_file:
      - .env.dev
    container_name: mydocmost-dev
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_URL: http://127.0.0.1:${DEV_APP_HOST_PORT:-3011}
      SERVER_PROXY_URL: http://127.0.0.1:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - ${DEV_APP_HOST_PORT:-3011}:3000
      - ${DEV_CLIENT_HOST_PORT:-5173}:5173
    volumes:
      - .:/app
      - ./data/dev/docmost:/app/data/storage
      - docmost_dev_node_modules:/app/node_modules
      - docmost_dev_client_node_modules:/app/apps/client/node_modules
      - docmost_dev_server_node_modules:/app/apps/server/node_modules
      - docmost_dev_editor_ext_node_modules:/app/packages/editor-ext/node_modules
      - docmost_dev_nx_cache:/app/.nx
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: mydocmost-dev-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${DEV_POSTGRES_HOST_PORT:-25433}:5432
    restart: unless-stopped
    volumes:
      - ./data/dev/db:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1-alpine3.23
    container_name: mydocmost-dev-cache
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - ${DEV_REDIS_HOST_PORT:-26379}:6379
    restart: unless-stopped
    volumes:
      - ./data/dev/valkey:/data

volumes:
  docmost_dev_node_modules:
  docmost_dev_client_node_modules:
  docmost_dev_server_node_modules:
  docmost_dev_editor_ext_node_modules:
  docmost_dev_nx_cache:
